<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mother's Day Surprise</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        overflow:hidden;
        font-family:Comic Sans MS, cursive;
        background:linear-gradient(135deg,#ffd6e7,#ffeccf,#ffe0f7);
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        transition:background 2s ease;
    }

    .screen{
        text-align:center;
        position:relative;
        width:100%;
        height:100%;
        display:flex;
        justify-content:center;
        align-items:center;
        flex-direction:column;
    }

    h1{
        font-size:3rem;
        color:#ff2e63;
        text-shadow:0 0 15px rgba(255,255,255,0.8);
        transition:all 1s ease;
    }

    #continueBtn{
        margin-top:30px;
        padding:15px 40px;
        border:none;
        border-radius:50px;
        background:linear-gradient(45deg,#ff5fa2,#ff8ec7);
        color:white;
        font-size:1.2rem;
        cursor:pointer;
        opacity:0;
        transform:translateY(20px);
        pointer-events:none;
        transition:all 1s ease;
        box-shadow:0 10px 25px rgba(255, 105, 180, 0.4);
    }

    #continueBtn.show{
        opacity:1;
        transform:translateY(0);
        pointer-events:auto;
    }

    #continueBtn:hover{
        transform:scale(1.08);
    }

    /* FINAL SCREEN */

    #finalScreen{
        display:none;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        background:radial-gradient(circle at center,#fff0f6,#ffd6e7,#ffc2dd);
        animation:bgPulse 6s infinite alternate;
    }

    @keyframes bgPulse{
        from{
            filter:hue-rotate(0deg);
        }
        to{
            filter:hue-rotate(25deg);
        }
    }

    .mothers-text{
        position:absolute;
        top:50px;
        font-size:4rem;
        font-family:cursive;
        color:#ff3d7f;
        opacity:0;
        animation:fadeIn 3s forwards;
        text-shadow:
            0 0 10px rgba(255,255,255,0.9),
            0 0 25px rgba(255,105,180,0.6);
    }

    @keyframes fadeIn{
        to{
            opacity:1;
        }
    }

    /* ROSE */

    .rose-wrapper{
        position:relative;
        width:300px;
        height:500px;
        display:flex;
        justify-content:center;
        align-items:center;
    }

    .stem{
        position:absolute;
        width:10px;
        height:0;
        background:linear-gradient(to bottom,#2c9b4b,#157532);
        bottom:50px;
        border-radius:20px;
        animation:growStem 3s forwards;
    }

    @keyframes growStem{
        to{
            height:280px;
        }
    }

    .leaf{
        position:absolute;
        width:70px;
        height:35px;
        background:#2dbd5f;
        border-radius:70px 0;
        opacity:0;
    }

    .leaf.left{
        transform:rotate(-35deg);
        left:95px;
        bottom:180px;
        animation:leafAppear 2s 2s forwards;
    }

    .leaf.right{
        transform:rotate(145deg);
        right:95px;
        bottom:240px;
        animation:leafAppear 2s 2.3s forwards;
    }

    @keyframes leafAppear{
        from{
            opacity:0;
            transform:scale(0) rotate(0deg);
        }
        to{
            opacity:1;
        }
    }

    .flower{
        position:absolute;
        top:80px;
        width:0;
        height:0;
        animation:bloom 3s 2.5s forwards;
    }

    @keyframes bloom{
        to{
            width:180px;
            height:180px;
        }
    }

    .petal{
        position:absolute;
        width:90px;
        height:90px;
        background:radial-gradient(circle at top,#ff9ac7,#ff2e63);
        border-radius:50%;
        opacity:0;
        animation:petalFade 1.5s forwards;
        box-shadow:0 0 20px rgba(255,70,120,0.5);
    }

    .petal:nth-child(1){
        left:45px;
        top:0;
        animation-delay:3s;
    }

    .petal:nth-child(2){
        left:0;
        top:45px;
        animation-delay:3.2s;
    }

    .petal:nth-child(3){
        right:0;
        top:45px;
        animation-delay:3.4s;
    }

    .petal:nth-child(4){
        left:45px;
        bottom:0;
        animation-delay:3.6s;
    }

    .petal:nth-child(5){
        left:45px;
        top:45px;
        background:radial-gradient(circle,#ffbfd9,#ff3d7f);
        animation-delay:3.8s;
    }

    @keyframes petalFade{
        from{
            opacity:0;
            transform:scale(0) rotate(-180deg);
        }
        to{
            opacity:1;
            transform:scale(1) rotate(0deg);
        }
    }

    /* Floating hearts */

    .heart{
        position:absolute;
        color:#ff4f8b;
        font-size:24px;
        animation:floatUp linear infinite;
        opacity:0.8;
    }

    @keyframes floatUp{
        from{
            transform:translateY(100vh) scale(0.5);
            opacity:0;
        }
        20%{
            opacity:1;
        }
        to{
            transform:translateY(-120vh) scale(1.2);
            opacity:0;
        }
    }

</style>
</head>

<body>

<div class="screen" id="homeScreen">
    <h1 id="mainText">April Fools!</h1>
    <button id="continueBtn">Continue</button>
</div>

<div class="screen" id="finalScreen">

    <div class="mothers-text">Happy Mother's Day</div>

    <div class="rose-wrapper">

        <div class="stem"></div>

        <div class="leaf left"></div>
        <div class="leaf right"></div>

        <div class="flower">
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
        </div>

    </div>

</div>

<script>

const text = document.getElementById("mainText");
const button = document.getElementById("continueBtn");

setTimeout(() => {
    text.innerText = "but wait, its not april...";
}, 5000);

setTimeout(() => {
    button.classList.add("show");
}, 12000);

button.addEventListener("click", () => {

    document.getElementById("homeScreen").style.display = "none";
    document.getElementById("finalScreen").style.display = "flex";

    createHearts();
});

function createHearts(){

    for(let i=0;i<40;i++){

        const heart = document.createElement("div");
        heart.classList.add("heart");

        heart.innerHTML = "❤";

        heart.style.left = Math.random()*100 + "vw";
        heart.style.animationDuration = (4 + Math.random()*5) + "s";
        heart.style.fontSize = (15 + Math.random()*30) + "px";

        document.body.appendChild(heart);

        setTimeout(()=>{
            heart.remove();
        },9000);
    }

    setInterval(()=>{

        const heart = document.createElement("div");
        heart.classList.add("heart");

        heart.innerHTML = "❤";

        heart.style.left = Math.random()*100 + "vw";
        heart.style.animationDuration = (4 + Math.random()*5) + "s";
        heart.style.fontSize = (15 + Math.random()*30) + "px";

        document.body.appendChild(heart);

        setTimeout(()=>{
            heart.remove();
        },9000);

    },300);
}

</script>

</body>
</html>
